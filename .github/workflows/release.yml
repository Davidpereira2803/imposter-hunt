name: Release app
run-name: Release ${{ github.ref_name }} to ${{ inputs.destination || 'testing' }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      destination:
        description: Store destination (select a version tag in the ref selector)
        required: true
        type: choice
        default: testing
        options: [testing, production]
      platform:
        description: Platforms to release
        required: true
        type: choice
        default: all
        options: [all, android, ios]

permissions:
  contents: read

# Serialize releases, including across tags, so store version numbers stay ordered.
concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.destination || 'testing' }}
    env:
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_DESTINATION: ${{ inputs.destination || 'testing' }}
      RELEASE_REF: ${{ github.ref_name }}
      RELEASE_NOTES: ${{ vars.IOS_RELEASE_NOTES }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform || github.event_name == 'push'
      - uses: actions/setup-node@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform || github.event_name == 'push'
        with:
          node-version: 22
          cache: npm
      - name: Build and submit selected platform
        if: inputs.platform == 'all' || inputs.platform == matrix.platform || github.event_name == 'push'
        id: release
        run: |
          npm ci --no-audit --no-fund
          node scripts/release-config.cjs
          npx eas-cli@16.23.1 build --platform "$RELEASE_PLATFORM" --profile production --non-interactive --wait --json > build-result.json
          node scripts/release-build.cjs
      - name: Upload exact build to store
        if: steps.release.outputs.id != ''
        env:
          BUILD_ID: ${{ steps.release.outputs.id }}
        run: npx eas-cli@16.23.1 submit --platform "$RELEASE_PLATFORM" --profile ci --id "$BUILD_ID" --non-interactive --wait
      - uses: ruby/setup-ruby@v1
        if: matrix.platform == 'ios' && inputs.destination == 'production' && steps.release.outputs.id != ''
        with:
          ruby-version: '3.3'
      - name: Submit iOS build for review and release after approval
        if: matrix.platform == 'ios' && inputs.destination == 'production' && steps.release.outputs.id != ''
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          RELEASE_NOTES: ${{ vars.IOS_RELEASE_NOTES }}
        run: |
          gem install fastlane --version 2.228.0 --no-document
          fastlane ios release
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/play-service-account.json" "$RUNNER_TEMP/app-store-connect.p8"
